<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Purabh's Portfolio</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/purabhworld.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="Purabh Singh — a walkable 3D voxel portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #ffe6ba; --sky-mid: #ffd183; --sky-bottom: #ffc06b;
      --cta: #5fd06a; --cta-dark: #3fb14e; --ink: #2b2620; --panel: #fffaf0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14103a;
      font-family: 'Baloo 2', system-ui, -apple-system, sans-serif; color: var(--ink); }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; touch-action: none; }
    /* UI overlay: click-through except for its own children */
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    /* Cinematic vignette: darkens the screen edges. Click-through. */
    #vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none;
      box-shadow: inset 0 0 200px 60px rgba(15, 8, 0, 0.5); }
    /* Children manage their own pointer-events (landing/panel = auto, HUD = none).
       A blanket "#ui > * { pointer-events:auto }" would override the HUD's
       'none' and make it swallow world clicks (right-click, drag-to-look). */
    #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 16px; font-family: 'Ubuntu', 'Baloo 2', sans-serif;
      font-weight: 700; font-size: 1.1rem; letter-spacing: .3px; color: #fff4dc;
      text-shadow: 0 3px 0 rgba(12, 8, 30, .55);
      /* same dusk sky as the landing screen, so the hand-off is seamless */
      background:
        radial-gradient(ellipse 48% 60% at 50% 48%, rgba(16, 10, 32, .6), rgba(16, 10, 32, .4) 55%, rgba(16, 10, 32, 0)),
        linear-gradient(180deg, #14103a 0%, #2a1e58 10%, #5e3570 17%, #b35e63 24%, #e08a66 30%, #e08a66 100%); }
    .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255, 244, 220, .2);
      border-top-color: #4ccc5c; box-shadow: 0 0 18px rgba(76, 204, 92, .35); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>
  <div id="vignette"></div>
  <div id="ui"></div>
  <div id="loading"><div class="spinner"></div>Loading Portfolio…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
